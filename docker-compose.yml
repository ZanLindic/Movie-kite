services:
  app:
    build:
      context: .
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      DATABASE_URL: sqlite:////app/data/movies.db
      MONGO_URI: mongodb://mongo:27017/movieDB
      API_KEY: ${API_KEY:-}
      FLASK_DEBUG: "0"
    volumes:
      - app_data:/app/data
    depends_on:
      - mongo
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  app_data:
  mongo_data:
